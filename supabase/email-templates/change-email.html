<div style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;background:#f5f7fb;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:32px 14px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;max-width:560px;background:#ffffff;border:1px solid #e3e8f0;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:28px;">
              <img src="https://cubicship.com/logo-160.png" width="72" height="72" alt="Cubic Ship" style="display:block;border:0;border-radius:14px;margin:0 0 18px 0;">
              <p style="margin:0 0 8px 0;color:#2f6fdd;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;">Account Update</p>
              <h1 style="margin:0 0 16px 0;color:#111827;font-size:28px;line-height:1.18;font-weight:800;">Confirm your new email.</h1>
              <p style="margin:0 0 24px 0;color:#435168;font-size:16px;line-height:1.6;">Confirm that <strong style="color:#111827;">{{ .NewEmail }}</strong> should be used for your Cubic Ship profile.</p>
              <p style="margin:0 0 24px 0;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2f6fdd;color:#ffffff;text-decoration:none;font-size:16px;font-weight:800;padding:14px 22px;border-radius:10px;">Confirm New Email</a>
              </p>
              <p style="margin:0;color:#667085;font-size:12px;line-height:1.55;word-break:break-all;">{{ .ConfirmationURL }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#101828;color:#d0d5dd;">
              <p style="margin:0;font-size:13px;line-height:1.5;">If you did not request this change, ignore this email and contact Cubic Ship.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
